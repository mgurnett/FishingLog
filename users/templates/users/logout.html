{% extends "catches/base/base.html" %}
{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 text-center">
                <div class="card-header bg-dark text-white py-3">
                    <h3 class="mb-0 fw-bold"><i class="bi bi-box-arrow-right text-info me-2"></i>Logged Out</h3>
                </div>
                <div class="card-body p-4 bg-light">
                    <h5 class="card-title mb-3">You have been logged out.</h5>
                    <p class="text-muted mb-4">Thanks for spending time on Stillwater Fishing Logs today!</p>
                    <a class="btn btn-primary" href="{% url 'login' %}">Log In Again</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
