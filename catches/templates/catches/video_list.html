{% extends "catches/base/base.html" %}
{% block title %}Videos{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-1"> </div>
    <div class="col-md-10">
        <h1 class="h3">Videos</h1>
        {% include 'snippets/video_list.html' %}

        <div class="row">
            <div class="col-md-8"> </div>
            <div class="col-md-6 text-end">
                <a class="btn btn-primary btn-md mt-1 mb-1" href="{% url 'video_create' %}"><i class="bi bi-plus-circle-fill me-1"></i>New video</a>
                <a class="btn btn-primary btn-md mt-1 mb-1" href="{% url 'catch_home' %}"><i class="bi bi-house-door-fill me-1"></i>Home</a>
                <button class="btn btn-primary btn-md mt-1 mb-1" onclick="window.history.back()"><i class="bi bi-arrow-left-circle-fill me-1"></i>Back</button>
            </div>
        </div>
    </div>
    <div class="col-md-1"> </div>
</div>
{% endblock content %}
